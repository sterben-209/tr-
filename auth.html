<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/mas_gte_green.png" type="image/png">
    <title>Emotea - Đăng nhập</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Mulish:wght@200..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="feedback.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Mulish', sans-serif;
            background-color: #0c0c0c;
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .auth-container {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
            text-align: center;
        }
        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: #d4a373;
            text-decoration: none;
            display: block;
        }
        .subtitle {
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            opacity: 0.6;
            margin-bottom: 2.5rem;
        }
        .auth-tabs {
            display: flex;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .tab {
            flex: 1;
            padding: 1rem;
            cursor: pointer;
            opacity: 0.5;
            transition: 0.3s;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .tab.active {
            opacity: 1;
            color: #d4a373;
            border-bottom: 2px solid #d4a373;
        }
        form { display: flex; flex-direction: column; gap: 1.2rem; }
        .input-group { position: relative; text-align: left; }
        .input-group i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.4;
        }
        input {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.8rem;
            color: white;
            outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: #d4a373; background: rgba(255, 255, 255, 0.08); }
        .btn-auth {
            background: #d4a373;
            color: black;
            padding: 1rem;
            border: none;
            border-radius: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1rem;
            transition: 0.3s;
        }
        .btn-auth:hover { background: #b48454; transform: translateY(-2px); }
        .hidden { display: none; }
        .switch-text { margin-top: 1.5rem; font-size: 0.85rem; opacity: 0.6; }
        .switch-text span { color: #d4a373; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-container">
        <a href="index.html" class="logo">Emotea</a>
        <p class="subtitle">Mental Care Tea</p>

        <div class="auth-tabs">
            <div class="tab active" id="login-tab">ĐĂNG NHẬP</div>
            <div class="tab" id="register-tab">ĐĂNG KÝ</div>
        </div>

        <!-- Login Form -->
        <form id="login-form">
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="login-email" placeholder="Email của bạn" required>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="login-pass" placeholder="Mật khẩu" required>
            </div>
            <button type="submit" class="btn-auth">VÀO CỬA HÀNG</button>
            <p class="switch-text">Chưa có tài khoản? <span onclick="toggleAuth('register')">Đăng ký ngay</span></p>
        </form>

        <!-- Register Form -->
        <form id="register-form" class="hidden">
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="reg-name" placeholder="Họ và tên" required>
            </div>
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="reg-email" placeholder="Email của bạn" required>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="reg-pass" placeholder="Mật khẩu" required>
            </div>
            <button type="submit" class="btn-auth">TẠO TÀI KHOẢN</button>
            <p class="switch-text">Đã có tài khoản? <span onclick="toggleAuth('login')">Đăng nhập</span></p>
        </form>
    </div>

    <script src="utils.js"></script>
    <script>
        const loginForm = document.getElementById('login-form');
        const regForm = document.getElementById('register-form');
        const loginTab = document.getElementById('login-tab');
        const regTab = document.getElementById('register-tab');

        function toggleAuth(type) {
            if (type === 'login') {
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
                loginTab.classList.add('active');
                regTab.classList.remove('active');
            } else {
                loginForm.classList.add('hidden');
                regForm.classList.remove('hidden');
                loginTab.classList.remove('active');
                regTab.classList.add('active');
            }
        }

        loginTab.onclick = () => toggleAuth('login');
        regTab.onclick = () => toggleAuth('register');

        // Logic Đăng ký
        regForm.onsubmit = async (e) => {
            e.preventDefault();
            const btn = regForm.querySelector('button');
            btn.innerText = 'ĐANG TẠO...';

            const rawPassword = document.getElementById('reg-pass').value;
            const hashedPassword = await hashPassword(rawPassword); // Băm ngay lập tức

            const data = {
                action: "REGISTER",
                name: document.getElementById('reg-name').value,
                email: document.getElementById('reg-email').value,
                password: hashedPassword // Chỉ gửi mã hash
            };
            
            await sendToDatabase(data);
            console.log('Đăng ký thành công!');
            toggleAuth('login');
            btn.innerText = 'TẠO TÀI KHOẢN';
        };

        // Logic Đăng nhập
        loginForm.onsubmit = async (e) => {
            e.preventDefault();
            const btn = loginForm.querySelector('button');
            btn.innerText = 'ĐANG KIỂM TRA...';

            const email = document.getElementById('login-email').value;
            const rawPassword = document.getElementById('login-pass').value;
            const inputHash = await hashPassword(rawPassword); // Băm ngay lập tức
            
            try {
                if (typeof CONFIG_GOOGLE_URL === 'undefined') return;

                // Lấy thông tin từ Google Sheet dựa trên email
                const response = await fetch(`${CONFIG_GOOGLE_URL}?email=${email}`);
                
                // Nếu bị lỗi CORS ở đây, trình duyệt sẽ nhảy thẳng vào khối catch
                if (!response.ok) throw new Error('Kết nối Database thất bại');

                const dbUser = await response.json();
                
                if (dbUser && dbUser.email) {
                    const inputHash = await hashPassword(rawPassword);
                    if (inputHash === dbUser.password) {
                        localStorage.setItem('user', JSON.stringify({ name: dbUser.name, email: dbUser.email }));
                        if (dbUser.cart && dbUser.cart !== "[]") {
                            localStorage.setItem('cart', dbUser.cart);
                        }
                        console.log('Chào mừng quay trở lại!');
                        window.location.href = 'account.html';
                    } else {
                        alert('Mật khẩu không chính xác!');
                    }
                } else {
                    alert('Tài khoản không tồn tại hoặc lỗi kết nối. Hãy thử lại bằng Tab ẩn danh!');
                }
            } catch (error) {
                console.error('Lỗi:', error);
            } finally {
                btn.innerText = 'VÀO CỬA HÀNG';
            }
        };
    </script>
    <!-- Floating Feedback Button -->
    <div id="feedback-trigger" class="feedback-trigger">
        <i class="fas fa-star"></i>
        <span>Góp ý</span>
    </div>

    <!-- Feedback Modal -->
    <div id="feedback-modal" class="feedback-modal">
        <div id="feedback-overlay" class="feedback-overlay"></div>
        <div class="feedback-container glass-panel rounded-3xl p-8">
            <span id="close-feedback" class="close-feedback">&times;</span>
            
            <!-- Form nhập phản hồi -->
            <div id="feedback-form-container" class="transition-all duration-500">
                <div class="text-center mb-6">
                    <h2 class="text-2xl font-extrabold text-gray-900 mb-1 tracking-tight">Góp ý cho tụi mình nhé! ✨</h2>
                    <p class="text-gray-700 font-medium text-xs">Trải nghiệm của bạn là mảnh ghép quan trọng nhất.</p>
                </div>

                <form id="feedback-form" class="space-y-4">
                    
                    <!-- Phần đánh giá Emoji -->
                    <div class="flex flex-col items-center mb-2">
                        <label class="block text-xs font-bold text-gray-800 mb-2">Cảm xúc của bạn lúc này?</label>
                        <div class="flex justify-between w-full px-4" id="emoji-rating">
                            <span class="emoji-btn" data-value="1" title="Tồi tệ"><img src="https://lh3.googleusercontent.com/d/1rCpZaPxiJ7NP05Ch9l4RydN3xWvIBdtc" style="width: 40px; height: 40px; display: inline-block; border-radius: 50%; background: transparent; mix-blend-mode: multiply;"></span>
                            <span class="emoji-btn" data-value="2" title="Không vui"><img src="https://lh3.googleusercontent.com/d/1qw0mgF_dT9xhO28typpwCjzCLVOW9IIy" style="width: 40px; height: 40px; display: inline-block; border-radius: 50%; background: transparent; mix-blend-mode: multiply;"></span>
                            <span class="emoji-btn" data-value="3" title="Bình thường"><img src="https://lh3.googleusercontent.com/d/1-8GT1AlrkOolZ_A-HW-RyLjhg34twZaS" style="width: 40px; height: 40px; display: inline-block; border-radius: 50%; background: transparent; mix-blend-mode: multiply;"></span>
                            <span class="emoji-btn" data-value="4" title="Hài lòng"><img src="https://lh3.googleusercontent.com/d/14J0bMNaPeskCjUnAT6esGodSI2-kVZVY" style="width: 40px; height: 40px; display: inline-block; border-radius: 50%; background: transparent; mix-blend-mode: multiply;"></span>
                            <span class="emoji-btn" data-value="5" title="Tuyệt vời"><img src="https://lh3.googleusercontent.com/d/15rz8zIyZDweMRnjEIs9pY0waOQZQjgv1" style="width: 40px; height: 40px; display: inline-block; border-radius: 50%; background: transparent; mix-blend-mode: multiply;"></span>
                        </div>
                        
                        <!-- Text hiển thị cảm xúc -->
                        <div id="feeling-text" class="h-4 mt-2 text-base font-bold text-indigo-700 opacity-0 transition-opacity duration-300">
                            Tuyệt vời
                        </div>

                        <!-- Input ẩn -->
                        <input type="hidden" name="rating" id="rating-input" required>
                        <p id="rating-error" class="text-red-600 font-medium text-xs mt-1 hidden bg-red-100/80 px-3 py-1 rounded-full">Oops! Bạn quên chọn biểu cảm kìa.</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div>
                            <label for="name" class="block text-xs font-bold text-gray-800 mb-1 ml-1">Tên của bạn</label>
                            <input type="text" id="name" name="name" placeholder="Ví dụ: Hoàng Bách" class="w-full px-3 py-2 rounded-xl glass-input transition-all text-sm">
                        </div>
                        
                        <div>
                            <label for="email" class="block text-xs font-bold text-gray-800 mb-1 ml-1">Email (Tùy chọn)</label>
                            <input type="email" id="email" name="email" placeholder="bach@example.com" class="w-full px-3 py-2 rounded-xl glass-input transition-all text-sm">
                        </div>
                    </div>

                    <div>
                        <label for="message" class="block text-xs font-bold text-gray-800 mb-1 ml-1">Điều gì làm bạn ấn tượng nhất? <span class="text-red-500">*</span></label>
                        <textarea id="message" name="message" rows="2" required placeholder="Cứ thoải mái chia sẻ nha..." class="w-full px-3 py-2 rounded-xl glass-input transition-all resize-none text-sm"></textarea>
                    </div>

                    <!-- Nút Submit -->
                    <button type="submit" class="w-full relative group overflow-hidden bg-gray-900 text-white font-bold py-3 px-6 rounded-2xl transition-all hover:scale-[1.02] hover:shadow-xl active:scale-95">
                        <span class="relative z-10 flex items-center justify-center gap-2">
                            Gửi Yêu Thương
                            <svg class="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </span>
                        <div class="absolute inset-0 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                    </button>
                </form>
            </div>

            <!-- Màn hình cảm ơn -->
            <div id="success-message" class="hidden text-center py-8">
                <div class="w-16 h-16 bg-white/40 rounded-full flex items-center justify-center mx-auto mb-4 shadow-inner relative">
                    <span class="text-3xl absolute animate-bounce" style="animation-duration: 2s;">🎉</span>
                </div>
                <h3 class="text-2xl font-extrabold text-gray-900 mb-2">Đã nhận được!</h3>
                <p class="text-gray-800 font-medium text-base px-4">Cảm ơn bạn đã dành chút thời gian. ❤️</p>
                <button onclick="resetFeedbackForm()" class="mt-6 px-5 py-2 bg-white/50 hover:bg-white/80 rounded-full text-gray-900 font-bold transition-all shadow-sm">
                    Viết thêm cái nữa?
                </button>
            </div>
        </div>
    </div>
</body>
<script src="feedback.js"></script>
</html>
