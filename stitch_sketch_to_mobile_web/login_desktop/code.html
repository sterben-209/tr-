<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - Digital Scrapbook</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&amp;family=Quicksand:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-primary-container": "#786932",
                        "background": "#fbf9f8",
                        "primary-fixed-dim": "#d8c685",
                        "on-surface": "#1b1c1c",
                        "on-primary": "#ffffff",
                        "error": "#ba1a1a",
                        "surface-variant": "#e4e2e2",
                        "surface-container-low": "#f5f3f3",
                        "outline": "#7c7769",
                        "tertiary-fixed-dim": "#efb7ca",
                        "on-error-container": "#93000a",
                        "inverse-surface": "#303030",
                        "on-secondary-fixed": "#001e2e",
                        "tertiary": "#7e5262",
                        "outline-variant": "#cdc6b6",
                        "surface-container-high": "#eae8e7",
                        "surface": "#fbf9f8",
                        "on-background": "#1b1c1c",
                        "error-container": "#ffdad6",
                        "on-surface-variant": "#4b463a",
                        "tertiary-container": "#ffe5ec",
                        "secondary-fixed-dim": "#a3cce9",
                        "primary": "#6b5e28",
                        "tertiary-fixed": "#ffd9e4",
                        "secondary-container": "#b6dffd",
                        "surface-container-lowest": "#ffffff",
                        "surface-container": "#efeded",
                        "on-tertiary": "#ffffff",
                        "on-secondary-container": "#3b637d",
                        "surface-dim": "#dbd9d9",
                        "primary-container": "#ffeba7",
                        "on-error": "#ffffff",
                        "secondary-fixed": "#c7e7ff",
                        "surface-tint": "#6b5e28",
                        "on-secondary-fixed-variant": "#204b63",
                        "inverse-on-surface": "#f2f0f0",
                        "on-tertiary-container": "#8a5d6d",
                        "on-tertiary-fixed": "#31101e",
                        "on-primary-fixed": "#221b00",
                        "primary-fixed": "#f5e29f",
                        "secondary": "#3a637c",
                        "surface-bright": "#fbf9f8",
                        "on-secondary": "#ffffff",
                        "on-tertiary-fixed-variant": "#633b4a",
                        "on-primary-fixed-variant": "#524612",
                        "surface-container-highest": "#e4e2e2",
                        "inverse-primary": "#d8c685"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "stack-sm": "8px",
                        "stack-md": "16px",
                        "margin-page": "20px",
                        "gutter": "12px",
                        "stack-lg": "32px"
                    },
                    fontFamily: {
                        "headline-md": ["Plus Jakarta Sans"],
                        "body-md": ["Quicksand"],
                        "label-sm": ["Quicksand"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "body-lg": ["Quicksand"]
                    },
                    fontSize: {
                        "headline-md": ["22px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "26px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .hand-drawn-border {
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
        }
        .hand-drawn-border-alt {
            border-radius: 15px 225px 15px 255px/255px 15px 225px 15px;
        }
        .pencil-outline {
            filter: url(#wobble);
        }
        
        /* Offset Shadow Variables */
        .shadow-offset-primary {
            box-shadow: 6px 6px 0px 0px #f5e29f;
        }
        .shadow-offset-charcoal {
            box-shadow: 4px 4px 0px 0px #7c7769;
        }
        .hover-sink:hover {
            box-shadow: 0px 0px 0px 0px transparent;
            transform: translate(4px, 4px);
        }

        /* Ruled line input styling */
        .ruled-input {
            background: repeating-linear-gradient(
                to bottom,
                transparent,
                transparent 31px,
                #cdc6b6 31px,
                #cdc6b6 32px
            );
            background-attachment: local;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex items-center justify-center p-margin-page selection:bg-primary-container selection:text-on-primary-container">
<!-- SVG Filter for hand-drawn wobble effect -->
<svg class="absolute hidden" height="0" width="0">
<filter id="wobble">
<feturbulence basefrequency="0.05" numoctaves="3" result="noise" type="fractalNoise"></feturbulence>
<fedisplacementmap in="SourceGraphic" in2="noise" scale="2" xchannelselector="R" ychannelselector="G"></fedisplacementmap>
</filter>
</svg>
<main class="w-full max-w-md relative z-10">
<!-- Decorative Washi Tape -->
<div class="absolute -top-4 left-1/2 -translate-x-1/2 w-32 h-8 bg-tertiary-fixed-dim/50 transform -rotate-2 z-20 pencil-outline hand-drawn-border"></div>
<!-- Login Card -->
<div class="bg-surface-container-lowest border-[2px] border-outline hand-drawn-border p-stack-lg shadow-offset-primary relative z-10">
<div class="text-center mb-stack-lg">
<span class="material-symbols-outlined text-4xl text-primary mb-stack-sm" data-weight="fill" style="font-variation-settings: 'FILL' 1;">
                    edit_document
                </span>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-stack-sm">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Your scrapbook is waiting for you.</p>
</div>
<form class="space-y-stack-md">
<!-- Email / Username Input -->
<div class="relative pt-4 group">
<span class="material-symbols-outlined absolute left-0 bottom-2 text-outline-variant group-focus-within:text-primary transition-colors">
                        person
                    </span>
<input class="w-full bg-transparent border-0 border-b-2 border-outline-variant pl-8 pr-4 py-2 font-body-md text-body-md text-on-surface focus:ring-0 focus:border-primary focus:bg-primary-container/20 transition-all placeholder:text-outline-variant outline-none" id="username" name="username" placeholder="Email or Username" required="" type="text"/>
</div>
<!-- Password Input -->
<div class="relative pt-4 group">
<span class="material-symbols-outlined absolute left-0 bottom-2 text-outline-variant group-focus-within:text-primary transition-colors">
                        lock
                    </span>
<input class="w-full bg-transparent border-0 border-b-2 border-outline-variant pl-8 pr-4 py-2 font-body-md text-body-md text-on-surface focus:ring-0 focus:border-primary focus:bg-primary-container/20 transition-all placeholder:text-outline-variant outline-none" id="password" name="password" placeholder="Password" required="" type="password"/>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end pt-stack-sm">
<a class="font-label-sm text-label-sm text-secondary hover:text-primary transition-colors underline decoration-wavy decoration-1 underline-offset-4" href="#">Forgot Password?</a>
</div>
<!-- Log In Button -->
<div class="pt-stack-lg">
<button class="w-full flex items-center justify-center gap-2 bg-primary-container text-on-primary-container border-[2px] border-outline hand-drawn-border-alt py-3 px-6 shadow-offset-charcoal hover-sink transition-all duration-200" type="submit">
<span class="font-headline-md text-headline-md">Log In</span>
<span class="material-symbols-outlined">
                            arrow_forward
                        </span>
</button>
</div>
</form>
<!-- Sign Up Link -->
<div class="mt-stack-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    New here? 
                    <a class="font-headline-md text-headline-md text-primary hover:text-primary-fixed-dim transition-colors underline decoration-2 underline-offset-4 hand-drawn-border" href="#">Sign Up</a>
</p>
</div>
</div>
<!-- Decorative elements -->
<div class="absolute -bottom-6 -right-6 text-primary-fixed-dim/40 transform rotate-12 z-0">
<span class="material-symbols-outlined text-6xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">
                favorite
            </span>
</div>
<div class="absolute -top-10 -left-8 text-secondary-fixed-dim/40 transform -rotate-12 z-0">
<span class="material-symbols-outlined text-5xl">
                star
            </span>
</div>
</main>
</body></html>
