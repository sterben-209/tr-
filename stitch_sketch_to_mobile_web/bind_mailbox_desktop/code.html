<!DOCTYPE html>

<html class="light" lang="en"><head>

<style>
        .hand-drawn-border {
            border: 2px solid theme('colors.on-surface');
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
        }
        .hand-drawn-input {
            border-bottom: 2px solid theme('colors.outline-variant');
            background: transparent;
            border-radius: 0;
        }
        .hand-drawn-input:focus {
            outline: none;
            border-bottom-color: theme('colors.primary');
            box-shadow: 0 4px 6px -1px theme('colors.primary-container');
        }
        .shadow-offset {
            box-shadow: 4px 4px 0px 0px theme('colors.primary-container');
        }
        .shadow-offset:active {
            box-shadow: 0px 0px 0px 0px theme('colors.primary-container');
            transform: translate(4px, 4px);
        }
      </style>
</head>
<body class="bg-background text-on-background font-body-md h-screen flex overflow-hidden">
<!-- Top App Bar (Mobile Only - Suppressed on Desktop for Sidebar) -->
<header class="flex justify-between items-center px-margin-page py-stack-sm w-full bg-surface border-b-2 border-outline-variant md:hidden fixed top-0 z-50">
<button class="text-primary p-2">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">Account Settings</h1>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<!-- Sidebar (Desktop Only) -->
<nav class="hidden md:flex flex-col w-64 bg-surface border-r-2 border-outline-variant h-full p-margin-page">
<div class="font-headline-lg text-headline-lg text-on-surface mb-stack-lg pl-2">
            My Diary
        </div>
<ul class="space-y-stack-sm flex-grow">
<li>
<a class="flex items-center gap-3 px-4 py-3 rounded-full text-on-surface-variant hover:bg-surface-container-high transition-colors" href="#">
<span class="material-symbols-outlined" data-weight="fill">calendar_month</span>
<span class="font-label-sm text-label-sm">Calendar</span>
</a>
</li>
<li>
<a class="flex items-center gap-3 px-4 py-3 rounded-full text-on-surface-variant hover:bg-surface-container-high transition-colors" href="#">
<span class="material-symbols-outlined">local_mall</span>
<span class="font-label-sm text-label-sm">Store</span>
</a>
</li>
<li>
<a class="flex items-center gap-3 px-4 py-3 rounded-full text-on-surface-variant hover:bg-surface-container-high transition-colors" href="#">
<span class="material-symbols-outlined">book</span>
<span class="font-label-sm text-label-sm">Diary</span>
</a>
</li>
<li>
<a class="flex items-center gap-3 px-4 py-3 rounded-full bg-primary-container text-on-primary-container font-semibold transition-colors" href="#">
<span class="material-symbols-outlined" data-weight="fill">person</span>
<span class="font-label-sm text-label-sm">Account</span>
</a>
</li>
</ul>
</nav>
<!-- Main Content Canvas -->
<main class="flex-grow overflow-y-auto p-margin-page md:p-stack-lg flex justify-center items-start md:items-center mt-16 md:mt-0">
<!-- Focused Card -->
<div class="bg-surface w-full max-w-md hand-drawn-border p-stack-lg shadow-offset relative">
<!-- Decorative "Tape" -->
<div class="absolute -top-3 left-1/2 -translate-x-1/2 w-24 h-6 bg-secondary-fixed/50 -rotate-2 mix-blend-multiply"></div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-stack-md text-center">Bind Mailbox</h2>
<p class="font-body-md text-body-md text-on-surface-variant text-center mb-stack-lg">Secure your diary by connecting your email address.</p>
<form class="space-y-stack-md flex flex-col h-full">
<!-- Email Field -->
<div class="flex flex-col">
<label class="font-label-sm text-label-sm text-on-surface-variant mb-1" for="email">Email Address</label>
<input class="hand-drawn-input font-body-lg text-body-lg text-on-surface w-full py-2 placeholder-outline-variant" id="email" placeholder="your@email.com" required="" type="email"/>
</div>
<!-- Verification Code Field Group -->
<div class="flex flex-col">
<label class="font-label-sm text-label-sm text-on-surface-variant mb-1" for="code">Verification Code</label>
<div class="flex gap-stack-sm items-end">
<input class="hand-drawn-input font-body-lg text-body-lg text-on-surface flex-grow py-2 placeholder-outline-variant" id="code" placeholder="6-digit code" required="" type="text"/>
<button class="bg-secondary-fixed text-on-secondary-fixed font-label-sm text-label-sm px-4 py-2 hand-drawn-border hover:bg-secondary-fixed-dim transition-colors whitespace-nowrap" type="button">
                            Send Code
                        </button>
</div>
</div>
<!-- Spacer to push button to bottom if card needs to stretch, though defined as compact card here -->
<div class="h-stack-lg"></div>
<!-- Confirm Button -->
<button class="w-full bg-primary text-on-primary font-headline-md text-headline-md py-3 hand-drawn-border shadow-offset transition-all mt-auto" type="submit">
                    Confirm Binding
                </button>
</form>
</div>
</main>
<!-- Bottom Nav Bar (Mobile Only - Suppressed on Desktop) -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center bg-surface px-2 py-3 border-t-2 border-outline-variant md:hidden z-50 rounded-t-xl pb-safe">
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1" href="#">
<span class="material-symbols-outlined">calendar_month</span>
<span class="font-label-sm text-label-sm mt-1">Calendar</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1" href="#">
<span class="material-symbols-outlined">local_mall</span>
<span class="font-label-sm text-label-sm mt-1">Store</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1" href="#">
<span class="material-symbols-outlined">book</span>
<span class="font-label-sm text-label-sm mt-1">Diary</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1" href="#">
<span class="material-symbols-outlined" data-weight="fill">person</span>
<span class="font-label-sm text-label-sm mt-1">Account</span>
</a>
</nav>
</body></html>
