<h1 class="text-on-surface">Edit Profile</h1>

</header>
<!-- Main Content -->
<main class="px-margin-page py-stack-md flex flex-col gap-stack-lg max-w-md mx-auto">
<!-- Avatar Section -->
<section class="flex flex-col items-center gap-stack-sm mt-stack-md">
<div class="w-24 h-24 bg-surface-container hand-drawn-avatar flex items-center justify-center relative overflow-hidden">
<img alt="User Avatar" class="w-full h-full object-cover" data-alt="A softly lit, pastel-toned portrait of a young person in a casual setting, suitable for a profile avatar in a gentle, journaling app. The image features soft focus, warm lighting, and a calm, approachable mood." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCcHqgafQ5xK7eBn7wRncWP8uHOaF3M7U_DzIgOYc2GueFFeTKp82a2K9lGYbRedHkpJE2iYadzI4GWIlhpo0FW9tpxvu_cAHTv7acPFc7hAWniwnlW8vXVvDYX1LBgord_eVQMirGmdIStYP0LayFsNOfgKPbRB3BhxdTD9-TOIdH80-IJ0YAQY64bO71RQc8My-IKus-Opt3JNBCOnxX6TaXIYTr1cBPAL2R0W4rvqplIT9_6fMtaT5jPKTxvPueEWMTpMD0UPUXh"/>
</div>
<button class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors py-1 px-3 border border-outline-variant rounded-full mt-2">
                Change Avatar
            </button>
</section>
<!-- Profile Items List -->
<section class="bg-surface-container-lowest hand-drawn-border p-4 flex flex-col gap-4">
<!-- Item: Nickname -->
<button class="flex items-center justify-between py-2 group w-full text-left">
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-outline">Nickname</span>
<span class="font-body-md text-body-md text-on-surface">cua thúi</span>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors">chevron_right</span>
</button>
<div class="hand-drawn-divider w-full my-1"></div>
<!-- Item: Introduction -->
<button class="flex items-center justify-between py-2 group w-full text-left">
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-outline">Introduction</span>
<span class="font-body-md text-body-md text-on-surface-variant truncate max-w-[200px]">You can fill in your interests...</span>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors">chevron_right</span>
</button>
<div class="hand-drawn-divider w-full my-1"></div>
<!-- Item: ID -->
<button class="flex items-center justify-between py-2 group w-full text-left">
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-outline">ID</span>
<span class="font-body-md text-body-md text-on-surface">123456</span>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors">content_copy</span>
</button>
<div class="hand-drawn-divider w-full my-1"></div>
<!-- Item: Email -->
<button class="flex items-center justify-between py-2 group w-full text-left">
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-outline">Email</span>
<span class="font-body-md text-body-md text-on-surface-variant">Not linked</span>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors">chevron_right</span>
</button>
</section>
<section class="flex justify-center mt-stack-md">
<button class="bg-primary-container text-on-primary-container hand-drawn-border px-8 py-3 font-body-lg text-body-lg hover:bg-surface-container-highest transition-colors flex items-center gap-2">

           </button>
</section>

<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-high transition-colors rounded-full">
<span class="material-symbols-outlined">calendar_month</span>
<span class="font-label-sm text-label-sm mt-1">Calendar</span>
</button>
<!-- Inactive: Store -->

<span class="material-symbols-outlined">book</span>

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-label-sm text-label-sm mt-1">Account</span>
</button>
