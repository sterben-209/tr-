<body class="bg-background text-on-background font-body-md min-h-screen flex selection:bg-primary-container selection:text-on-primary-container">

<!-- Main Content Area -->
<main class="flex-1 flex items-center justify-center p-margin-page relative">
<!-- Decorative elements -->
<div class="absolute top-10 left-10 w-24 h-24 bg-primary-container rounded-full opacity-30 mix-blend-multiply blur-xl"></div>
<div class="absolute bottom-20 right-20 w-32 h-32 bg-secondary-container rounded-full opacity-30 mix-blend-multiply blur-xl"></div>
<!-- Reset Password Card -->
<div class="w-full max-w-md relative z-10 group">
<!-- Hard Shadow Block -->
<div class="absolute inset-0 bg-primary-container rounded-xl translate-x-2 translate-y-2 border-2 border-outline hidden sm:block pointer-events-none hand-drawn-border"></div>
<!-- Card Content -->
<div class="relative bg-surface border-2 border-outline rounded-xl p-8 sm:p-10 hand-drawn-border">
<!-- "Washi Tape" Accent -->
<div class="absolute -top-3 left-1/2 -translate-x-1/2 w-16 h-6 bg-tertiary-container rotate-[-3deg] opacity-80 border border-outline-variant rounded-sm" style="clip-path: polygon(0 0, 100% 5%, 95% 100%, 5% 95%);"></div>
<!-- Header / Illustration -->
<div class="flex flex-col items-center text-center mb-8">
<div class="w-20 h-20 mb-6 relative flex items-center justify-center">
<!-- Hand-drawn style circular background -->
<div class="absolute inset-0 bg-secondary-container rounded-full border-2 border-outline hand-drawn-border opacity-70"></div>
<div class="absolute inset-0 bg-secondary-container rounded-full border-2 border-outline hand-drawn-border translate-x-1 translate-y-1 opacity-40"></div>
<span class="material-symbols-outlined text-4xl text-on-secondary-container z-10 relative">lock_reset</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-3 relative inline-block">
                        Reset Password
                        <svg class="absolute w-full h-3 -bottom-1 left-0 text-primary-container -z-10" preserveaspectratio="none" viewbox="0 0 100 10">
<path class="opacity-70" d="M0,5 Q50,0 100,5" fill="none" stroke="currentColor" stroke-width="4"></path>
</svg>
</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">
                        Create a new safe word for your digital scrapbook. Make it memorable.
                    </p>
</div>
<!-- Form -->
<form id="standalone-reset-form" class="flex flex-col gap-6">
<!-- New Password Input -->
<div class="relative">
<label class="font-label-sm text-label-sm text-on-surface-variant mb-2 block" for="new_password">New Password</label>
<div class="relative">
<input class="w-full bg-transparent border-none p-0 py-2 focus:ring-0 font-body-lg text-body-lg text-on-surface placeholder-on-surface-variant/50 notebook-line" id="new_password" name="new_password" placeholder="Write softly..." required="" type="password"/>
<button aria-label="Toggle password visibility" onclick="toggleLocalPass('new_password', this)" class="absolute right-0 top-1/2 -translate-y-1/2 p-2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Confirm Password Input -->
<div class="relative">
<label class="font-label-sm text-label-sm text-on-surface-variant mb-2 block" for="confirm_password">Confirm New Password</label>
<div class="relative">
<input class="w-full bg-transparent border-none p-0 py-2 focus:ring-0 font-body-lg text-body-lg text-on-surface placeholder-on-surface-variant/50 notebook-line" id="confirm_password" name="confirm_password" placeholder="Echo it here..." required="" type="password"/>
<button aria-label="Toggle password visibility" onclick="toggleLocalPass('confirm_password', this)" class="absolute right-0 top-1/2 -translate-y-1/2 p-2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<div class="mt-4 relative group/btn">
<!-- Button Shadow -->
<div class="absolute inset-0 bg-on-background translate-x-[3px] translate-y-[3px] rounded-lg border-2 border-outline pointer-events-none transition-transform group-hover/btn:translate-x-0 group-hover/btn:translate-y-0 group-active/btn:translate-x-0 group-active/btn:translate-y-0 hand-drawn-border"></div>
<button class="relative w-full bg-primary text-on-primary font-label-sm text-label-sm py-4 px-6 rounded-lg border-2 border-outline flex items-center justify-center gap-2 hover:bg-surface-tint transition-all active:translate-x-[3px] active:translate-y-[3px] hand-drawn-border" type="submit">
<span id="submit-text">Update Password</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
<div class="text-center mt-2">
<a class="font-label-sm text-label-sm text-secondary hover:text-on-secondary-container transition-colors inline-block relative after:content-[''] after:absolute after:w-full after:h-0.5 after:bg-secondary-container after:bottom-0 after:left-0 after:-z-10 hover:after:h-2 after:transition-all" href="../index.html#login">
                            Remembered it? Return to lock screen
                        </a>

<script>
    function toggleLocalPass(id, btn) {
        const input = document.getElementById(id);
        const icon = btn.querySelector('.material-symbols-outlined');
        if (input.type === 'password') {
            input.type = 'text';
            icon.innerText = 'visibility_off';
        } else {
            input.type = 'password';
            icon.innerText = 'visibility';
        }
    }

    document.getElementById('standalone-reset-form').onsubmit = async (e) => {
        e.preventDefault();
        const pass = document.getElementById('new_password').value.trim();
        const confirm = document.getElementById('confirm_password').value.trim();
        
        if (pass !== confirm) return alert('Mật khẩu xác nhận không khớp!');
        
        // Extract token from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        if (!token) {
            alert('Lỗi: Link không hợp lệ hoặc đã hết hạn. Vui lòng thực hiện lại bước Quên mật khẩu.');
            return;
        }

        const btnText = document.getElementById('submit-text');
        const btn = e.target.querySelector('button[type="submit"]');
        btnText.innerText = 'UPDATING...';
        btn.disabled = true;

        try {
            const hashedPass = await hashPassword(pass);
            const result = await sendToDatabase({
                action: "RESET_PASSWORD",
                token: token,
                newPassword: hashedPass
            });

            if (result.result === 'success') {
                alert('Mật khẩu đã được cập nhật thành công! Bạn có thể đăng nhập ngay bây giờ.');
                window.location.href = '../index.html#login';
            } else {
                alert('Lỗi: ' + (result.message || 'Không thể đặt lại mật khẩu.'));
            }
        } catch (err) {
            alert('Lỗi kết nối: ' + err.message);
        } finally {
            btnText.innerText = 'Update Password';
            btn.disabled = false;
        }
    };
</script>
