<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mood Selection - Calm Diary</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&amp;family=Quicksand:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {

                      "on-tertiary-fixed-variant": "#633b4a",
                      "surface-bright": "#fbf9f8",
                      "tertiary-fixed": "#ffd9e4",
                      "on-primary-container": "#786932",
                      "surface-variant": "#e4e2e2",
                      "inverse-on-surface": "#f2f0f0",
                      "surface-container-low": "#f5f3f3",
                      "surface": "#fbf9f8",
                      "secondary-container": "#b6dffd",
                      "on-primary-fixed-variant": "#524612",
                      "on-secondary-fixed": "#001e2e",
                      "secondary": "#3a637c",
                      "primary-fixed": "#f5e29f",
                      "inverse-primary": "#d8c685",
                      "on-error-container": "#93000a",
                      "on-tertiary": "#ffffff",
                      "on-secondary-fixed-variant": "#204b63",
                      "secondary-fixed": "#c7e7ff",
                      "tertiary-container": "#ffe5ec",
                      "on-secondary-container": "#3b637d",

                      "on-primary-fixed": "#221b00",
                      "surface-tint": "#6b5e28",
                      "inverse-surface": "#303030",
                      "on-error": "#ffffff",
                      "tertiary": "#7e5262",
                      "on-tertiary-fixed": "#31101e",
                      "on-surface": "#1b1c1c",
                      "surface-container-lowest": "#ffffff",
                      "surface-container-highest": "#e4e2e2",
                      "tertiary-fixed-dim": "#efb7ca",
                      "primary-fixed-dim": "#d8c685",

                      "error-container": "#ffdad6",

              },
              "borderRadius": {

<style>
        .hand-drawn-border {
            border: 2px solid #4b463a;
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
        }
        .hand-drawn-circle {
            border: 2px solid #4b463a;
            border-radius: 48% 52% 49% 51% / 51% 49% 52% 48%;
        }
        .hand-drawn-shadow {
            box-shadow: 4px 4px 0px 0px #ffeba7;
        }
        .hand-drawn-shadow-hover:hover {
            box-shadow: 2px 2px 0px 0px #ffeba7;
            transform: translate(2px, 2px);
        }
        
        .blur-overlay {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        /* --- Mood Popup - Clean Rewrite --- */
        .mood-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            z-index: 20;
        }

        .mood-item {
            position: absolute;
            top: 0;
            left: 0;
            width: 80px;
            height: 80px;
            /* Geometric positioning: 
               1. translate(-50%, -50%) centers the item itself on the center point
               2. rotate(var(--angle)) rotates the coordinate system
               3. translate(var(--distance)) moves the item outward along the rotated axis
               4. rotate(calc(-1 * var(--angle))) counter-rotates the content to keep it upright
            */
            transform: translate(-50%, -50%) rotate(var(--angle)) translate(var(--distance)) rotate(calc(-1 * var(--angle)));
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mood-label {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-top: 6px;
            white-space: nowrap;
            pointer-events: none;
        }


        .edit-mode .mood-item::after {
            content: 'edit';
            font-family: 'Material Symbols Outlined';
            position: absolute;
            top: 0;
            right: 0;
            background: #ffeba7;
            border-radius: 50%;
            padding: 4px;
            font-size: 16px;
            border: 1px solid #4b463a;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex overflow-hidden">
<!-- Desktop SideNav (Hidden on Mobile) -->
<nav class="hidden md:flex flex-col w-[240px] bg-surface h-screen border-r-2 border-outline-variant/30 flex-shrink-0 relative z-10 py-stack-lg">
<div class="px-margin-page mb-stack-lg">
<h1 class="font-headline-lg text-headline-lg text-on-surface">Calm Diary</h1>
</div>
<div class="flex flex-col gap-stack-sm px-gutter flex-1">
<a class="flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-surface-container-high transition-colors text-on-surface-variant font-body-lg text-body-lg" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">calendar_month</span>
<span>Calendar</span>
</a>
<a class="flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-surface-container-high transition-colors text-on-surface-variant font-body-lg text-body-lg" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">local_mall</span>
<span>Store</span>
</a>
<!-- Active State using semantic intent matching Diary/Compose -->
<a class="flex items-center gap-4 px-4 py-3 bg-primary-container text-on-primary-container rounded-xl hand-drawn-border font-body-lg text-body-lg" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">book</span>
<span>Diary</span>
</a>
<a class="flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-surface-container-high transition-colors text-on-surface-variant font-body-lg text-body-lg mt-auto" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">person</span>
<span>Account</span>
</a>
</div>
</nav>
<!-- Main Content Area (Blurred Background) -->
<main class="flex-1 relative h-screen w-full bg-surface-bright flex flex-col items-center justify-center">
<!-- Edit Mode Toggle -->
<div class="absolute top-8 right-8 z-30 flex gap-4">
    <button id="toggle-edit" class="px-6 py-2 bg-surface border-2 border-outline-variant rounded-xl hand-drawn-shadow hand-drawn-shadow-hover transition-all flex items-center gap-2 text-on-surface-variant font-bold">
        <span class="material-symbols-outlined">edit_note</span>
        <span>Customize Icons</span>
    </button>
</div>

<!-- Icon Gallery Modal (Hidden by default) -->
<div id="icon-gallery" class="fixed inset-0 z-50 flex items-center justify-center hidden">
    <div class="absolute inset-0 bg-surface/80 blur-overlay" id="gallery-overlay"></div>
    <div class="relative bg-surface w-[320px] p-6 rounded-3xl hand-drawn-border hand-drawn-shadow z-50">
        <div class="flex justify-between items-center mb-6">
            <h3 class="font-headline-md text-xl">Pick an Icon</h3>
            <button id="close-gallery" class="material-symbols-outlined">close</button>
        </div>
        <div class="grid grid-cols-4 gap-4 max-h-[300px] overflow-y-auto p-2" id="icon-list">
            <!-- Icons will be injected here -->
        </div>
    </div>
</div>

<!-- Mock background content to be blurred -->
<div class="absolute inset-0 p-8 flex flex-col gap-6 opacity-40 pointer-events-none">
<div class="max-w-3xl w-full mx-auto space-y-6">
<div class="h-12 w-48 bg-surface-variant rounded-md hand-drawn-border"></div>
<div class="space-y-4">
<div class="h-4 w-full bg-surface-variant rounded"></div>
<div class="h-4 w-5/6 bg-surface-variant rounded"></div>
<div class="h-4 w-4/6 bg-surface-variant rounded"></div>
<div class="h-4 w-full bg-surface-variant rounded"></div>
<div class="h-4 w-3/4 bg-surface-variant rounded"></div>
</div>
</div>
</div>
<!-- Blur Overlay -->
<div class="absolute inset-0 bg-surface/30 blur-overlay z-20 flex flex-col items-center justify-center">
<!-- Circular Modal -->
<div class="relative bg-surface w-[450px] h-[450px] rounded-full hand-drawn-circle flex flex-col items-center justify-center shadow-lg mb-8">
<!-- Central Text -->
<div class="absolute inset-0 flex items-center justify-center flex-col z-10 pointer-events-none">
<h2 class="font-headline-md text-headline-md text-on-surface text-center px-8">How are you<br/>today?</h2>
</div>
<!-- Mood Ring -->
<div id="mood-ring" class="mood-ring z-20">
<!-- Calm -->
<button class="mood-item group cursor-pointer focus:outline-none" style="--angle: -90deg; --distance: 140px;" data-mood="calm">
<div class="w-16 h-16 bg-surface rounded-full hand-drawn-circle flex items-center justify-center group-hover:bg-secondary-container transition-colors">
<span class="material-symbols-outlined text-4xl text-on-surface-variant icon-display" style="font-variation-settings: 'FILL' 0;">sentiment_satisfied</span>
</div>
<span class="mood-label font-label-sm text-label-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Calm</span>
</button>
<!-- Happy -->
<button class="mood-item group cursor-pointer focus:outline-none" style="--angle: -30deg; --distance: 140px;" data-mood="happy">
<div class="w-16 h-16 bg-surface rounded-full hand-drawn-circle flex items-center justify-center group-hover:bg-primary-container transition-colors">
<span class="material-symbols-outlined text-4xl text-on-surface-variant icon-display" style="font-variation-settings: 'FILL' 0;">sentiment_very_satisfied</span>
</div>
<span class="mood-label font-label-sm text-label-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Happy</span>
</button>
<!-- Excited -->
<button class="mood-item group cursor-pointer focus:outline-none" style="--angle: 30deg; --distance: 140px;" data-mood="excited">
<div class="w-16 h-16 bg-surface rounded-full hand-drawn-circle flex items-center justify-center group-hover:bg-tertiary-container transition-colors">
<span class="material-symbols-outlined text-4xl text-on-surface-variant icon-display" style="font-variation-settings: 'FILL' 0;">sentiment_excited</span>
</div>
<span class="mood-label font-label-sm text-label-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Excited</span>
</button>
<!-- Angry -->
<button class="mood-item group cursor-pointer focus:outline-none" style="--angle: 90deg; --distance: 140px;" data-mood="angry">
<div class="w-16 h-16 bg-surface rounded-full hand-drawn-circle flex items-center justify-center group-hover:bg-error-container transition-colors">
<span class="material-symbols-outlined text-4xl text-on-surface-variant icon-display" style="font-variation-settings: 'FILL' 0;">sentiment_very_dissatisfied</span>
</div>
<span class="mood-label font-label-sm text-label-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Angry</span>
</button>
<!-- Sad -->
<button class="mood-item group cursor-pointer focus:outline-none" style="--angle: 150deg; --distance: 140px;" data-mood="sad">
<div class="w-16 h-16 bg-surface rounded-full hand-drawn-circle flex items-center justify-center group-hover:bg-secondary-fixed-dim transition-colors">
<span class="material-symbols-outlined text-4xl text-on-surface-variant icon-display" style="font-variation-settings: 'FILL' 0;">sentiment_sad</span>
</div>
<span class="mood-label font-label-sm text-label-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Sad</span>
</button>
<!-- Tired -->
<button class="mood-item group cursor-pointer focus:outline-none" style="--angle: 210deg; --distance: 140px;" data-mood="tired">
<div class="w-16 h-16 bg-surface rounded-full hand-drawn-circle flex items-center justify-center group-hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-4xl text-on-surface-variant icon-display" style="font-variation-settings: 'FILL' 0;">sentiment_dissatisfied</span>
</div>
<span class="mood-label font-label-sm text-label-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Tired</span>
</button>
</div>
</div>
<!-- Close Button -->
<button class="w-14 h-14 bg-surface rounded-full hand-drawn-circle flex items-center justify-center hand-drawn-shadow hand-drawn-shadow-hover transition-all focus:outline-none text-on-surface-variant hover:text-on-surface hover:bg-surface-container">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</div>
</main>

<script>
    const ICONS = [
        'sentiment_satisfied', 'sentiment_very_satisfied', 'sentiment_excited', 
        'sentiment_very_dissatisfied', 'sentiment_sad', 'sentiment_dissatisfied',
        'favorite', 'star', 'wb_sunny', 'nightlight_round', 'cloud', 'eco',
        'auto_awesome', 'pets', 'rocket_launch', 'local_florist',
        'face', 'mood', 'mood_bad', 'sentiment_neutral'
    ];

    let isEditMode = false;
    let selectedMoodBtn = null;

    const toggleBtn = document.getElementById('toggle-edit');
    const moodRing = document.getElementById('mood-ring');
    const gallery = document.getElementById('icon-gallery');
    const iconList = document.getElementById('icon-list');
    const closeGallery = document.getElementById('close-gallery');
    const galleryOverlay = document.getElementById('gallery-overlay');

    // Load saved icons
    const savedIcons = JSON.parse(localStorage.getItem('customMoodIcons') || '{}');
    document.querySelectorAll('.mood-item').forEach(btn => {
        const mood = btn.dataset.mood;
        if (savedIcons[mood]) {
            btn.querySelector('.icon-display').textContent = savedIcons[mood];
        }
    });

    toggleBtn.addEventListener('click', () => {
        isEditMode = !isEditMode;
        moodRing.classList.toggle('edit-mode', isEditMode);
        toggleBtn.querySelector('span:last-child').textContent = isEditMode ? 'Finish Customizing' : 'Customize Icons';
        toggleBtn.classList.toggle('bg-primary-container', isEditMode);
    });

    moodRing.addEventListener('click', (e) => {
        if (!isEditMode) return;
        
        const btn = e.target.closest('.mood-item');
        if (btn) {
            selectedMoodBtn = btn;
            openGallery();
        }
    });

    function openGallery() {
        iconList.innerHTML = '';
        ICONS.forEach(iconName => {
            const iconBtn = document.createElement('button');
            iconBtn.className = 'w-12 h-12 flex items-center justify-center rounded-xl hover:bg-surface-container-high transition-colors text-2xl material-symbols-outlined';
            iconBtn.textContent = iconName;
            iconBtn.onclick = () => selectIcon(iconName);
            iconList.appendChild(iconBtn);
        });
        gallery.classList.remove('hidden');
    }

    function selectIcon(iconName) {
        if (selectedMoodBtn) {
            const iconDisplay = selectedMoodBtn.querySelector('.icon-display');
            iconDisplay.textContent = iconName;
            
            // Save to localStorage
            const mood = selectedMoodBtn.dataset.mood;
            const savedIcons = JSON.parse(localStorage.getItem('customMoodIcons') || '{}');
            savedIcons[mood] = iconName;
            localStorage.setItem('customMoodIcons', JSON.stringify(savedIcons));
            
            closeGalleryModal();
        }
    }

    function closeGalleryModal() {
        gallery.classList.add('hidden');
        selectedMoodBtn = null;
    }

    closeGallery.addEventListener('click', closeGalleryModal);
    galleryOverlay.addEventListener('click', closeGalleryModal);
</script>
</body></html>
