<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mascot Eye Follow - Calm Diary</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="mascot-wrapper">
            <div class="mascot" id="mascot">
                <div class="floating-container liquid-mascot">
                    <!-- Layer 1: Legs -->
                    <div class="leg-l left"></div>
                    <div class="leg-l right"></div>
                    
                    <!-- Layer 2: Shoes -->
                    <div class="shoe-l left"></div>
                    <div class="shoe-l right"></div>
                    
                    <!-- Layer 3: Head Shell & Content -->
                    <div class="head-shell">
                        <div class="shell-gloss"></div>
                        <div class="liquid-hair">
                            <div class="bubbles">
                                <span></span><span></span><span></span>
                            </div>
                        </div>
                        <!-- Layer 4: Mouth & Blush (Inside shell) -->
                        <div class="blush-l left"></div>
                        <div class="blush-l right"></div>
                        <div class="mouth-l"></div>
                    </div>
                    
                    <!-- Layer 5: Eyes (On top of everything) -->
                    <div class="eye-l left"><div class="glint-l"></div></div>
                    <div class="eye-l right"><div class="glint-l"></div></div>
                </div>
            </div>
        </div>
        <p class="hint">Chạm nhẹ vào tui để thấy điều kì diệu...</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
