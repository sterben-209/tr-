            border: 2px solid #1b1c1c;

            transition: all 0.2s ease;
        }
        .hand-drawn-shadow:hover {
            transform: translate(2px, 2px);

        }
        .notebook-line {
            background-color: transparent;

        .notebook-line:focus {
            outline: none;

<body class="bg-background text-on-surface font-body-md h-screen flex overflow-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Sidebar Navigation (Desktop) -->
<aside class="hidden md:flex flex-col w-64 h-full bg-surface border-r-2 border-outline-variant px-margin-page py-stack-lg z-10">
<div class="mb-12">
<h1 class="font-headline-lg text-headline-lg text-on-surface">Calm Diary</h1>
</div>
<nav class="flex flex-col gap-4 flex-1">
<!-- Calendar: Inactive -->
<a class="flex items-center gap-4 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-high transition-colors" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">calendar_month</span>
<span class="font-label-sm text-label-sm">Calendar</span>
</a>
<!-- Store: Inactive -->
<a class="flex items-center gap-4 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-high transition-colors" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">local_mall</span>
<span class="font-label-sm text-label-sm">Store</span>
</a>
<!-- Diary: Inactive -->
<a class="flex items-center gap-4 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-high transition-colors" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">book</span>
<span class="font-label-sm text-label-sm">Diary</span>
</a>
<!-- Account: Active -->
<a class="flex items-center gap-4 px-4 py-3 bg-primary-container text-on-primary-container hand-drawn-border relative group" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-label-sm text-label-sm">Account</span>
</a>
</nav>
</aside>
<!-- Main Content Area -->
<main class="flex-1 overflow-y-auto p-margin-page md:p-12 lg:px-24">
<div class="max-w-3xl mx-auto">
<header class="mb-10">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-2">Edit Profile</h2>
<p class="font-body-md text-on-surface-variant">Update your digital scrapbook identity.</p>
</header>
<div class="bg-surface rounded-2xl hand-drawn-border p-8 md:p-12 relative">
<!-- Washi Tape Accent -->
<div class="absolute -top-3 left-8 w-24 h-6 bg-secondary-container opacity-80 transform -rotate-2 mix-blend-multiply"></div>
<div class="flex flex-col md:flex-row gap-12">
<!-- Avatar Section -->
<div class="flex flex-col items-center gap-6 md:w-1/3">
<div class="relative w-32 h-32 md:w-40 md:h-40">
<div class="w-full h-full rounded-full hand-drawn-border overflow-hidden bg-surface-container-low flex items-center justify-center">
<img alt="User Avatar" class="w-full h-full object-cover" data-alt="A gentle, softly lit portrait of a young woman with a calm expression, perfect for a personal diary profile picture. The image has a warm, inviting aesthetic with slightly muted pastel tones and a soft focus, fitting a minimalist hand-drawn UI style. The lighting is natural and diffuse, highlighting a sense of quiet introspection." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAzkNvIEU3N00-6hRPzXGKkLh7Z-NbzInTk-070ZYeuVdsVnkun_IDUge63y18hkBiX4Rs6v36SvYpFFDYlCmq5zkw03legrWzRp59o3CmgAgM3baFuVPr1SXlXXaBbAJawN_-mn0dJ5V0prII8LXS4KKHYIepdcdsOr-yR0jkn1M1WaA-bE-EvsMQ3Tovwlt24Jqj_Jv6VYVQgr1BeU1EltCUC4F-qLBZoA_Ua9qL8umJWqeNqrAvE4BzV4HvtETESr0c-NjCuKRFq"/>
</div>
<!-- Small decorative element -->
<div class="absolute -bottom-2 -right-2 bg-primary-container w-8 h-8 rounded-full hand-drawn-border flex items-center justify-center text-on-primary-container transform rotate-12">
<span class="material-symbols-outlined text-sm">edit</span>
</div>
</div>
<button class="font-label-sm text-label-sm bg-surface-container-high text-on-surface px-6 py-2 hand-drawn-border hand-drawn-shadow hover:bg-surface-variant transition-colors">
                            Change Avatar
                        </button>
</div>
<!-- Form Section -->
<div class="flex-1 flex flex-col gap-8">
<!-- Nickname -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="nickname">Nickname</label>
<input class="w-full notebook-line text-on-surface font-body-lg" id="nickname" placeholder="How should we call you?" type="text" value="Quiet Thinker"/>
</div>
<!-- Introduction -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="intro">Introduction</label>
<textarea class="w-full notebook-line text-on-surface font-body-md resize-none" id="intro" placeholder="A few words about yourself..." rows="3">Just navigating through thoughts, one day at a time. Lover of tea and rainy afternoons.</textarea>
</div>
<!-- ID -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="userId">ID</label>
<input class="w-full notebook-line text-outline opacity-70 cursor-not-allowed font-body-md bg-transparent" disabled="" id="userId" type="text" value="user_94827x"/>
<p class="font-label-sm text-xs text-outline-variant mt-1">Your unique diary identifier cannot be changed.</p>
</div>
<!-- Email -->
<div class="flex flex-col gap-2 pt-4">
<div class="flex justify-between items-center mb-1">
<label class="font-label-sm text-label-sm text-on-surface-variant">Email</label>
<span class="font-label-sm text-xs bg-error-container text-on-error-container px-2 py-0.5 rounded-full hand-drawn-border border-[1px]">Not linked</span>
</div>
<div class="flex gap-4 items-center">
<input class="flex-1 notebook-line text-on-surface font-body-md" placeholder="Link your email for backup" type="email"/>
<button class="font-label-sm text-label-sm text-primary underline decoration-2 underline-offset-4 hover:text-on-primary-container">Link</button>
</div>
</div>
</div>
</div>
<!-- Footer Actions -->
<div class="mt-12 pt-8 border-t-2 border-outline-variant border-dashed flex justify-end gap-4">
<button class="font-label-sm text-label-sm px-6 py-3 text-on-surface-variant hover:text-on-surface transition-colors">
                        Cancel
                    </button>
<button class="font-label-sm text-label-sm bg-primary-container text-on-primary-container px-8 py-3 hand-drawn-border hand-drawn-shadow">
                        Save Changes
                    </button>
</div>
</div>
</div>
</main>
</body></html>
