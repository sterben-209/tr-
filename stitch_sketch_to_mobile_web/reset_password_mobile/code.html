<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Calm Diary - Reset Password</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                      "error": "#ba1a1a",
                      "surface-container-lowest": "#ffffff",
                      "secondary": "#3a637c",
                      "primary-fixed-dim": "#d8c685",
                      "primary-container": "#ffeba7",
                      "on-background": "#1b1c1c",

                      "inverse-surface": "#303030",

                      "secondary-container": "#b6dffd",
                      "surface-container": "#efeded",

                      "primary": "#6b5e28",
                      "primary-fixed": "#f5e29f",
                      "on-surface-variant": "#4b463a",
                      "surface-bright": "#fbf9f8",
                      "secondary-fixed": "#c7e7ff",
                      "on-tertiary-fixed-variant": "#633b4a",
                      "tertiary-container": "#ffe5ec",

<style>
        /* Hand-drawn style utilities */
        .sketchy-border {
            border: 2px solid #4b463a; /* on-surface-variant approx */
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
        }
        .sketchy-border-button {
            border: 2px solid #1b1c1c; /* on-surface */
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
        }
        .sketchy-shadow {
            box-shadow: 4px 4px 0px 0px #1b1c1c;
        }
        .sketchy-shadow-active:active {
            box-shadow: 0px 0px 0px 0px #1b1c1c;
            transform: translate(4px, 4px);
        }
        /* Focus state for inputs simulating a glow */
        .sketchy-input:focus {
            outline: none;
            background-color: #ffeba7; /* primary-container */
            box-shadow: 0 0 10px rgba(255, 235, 167, 0.5);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased md:items-center md:justify-center md:bg-surface-container-low">
<!-- Mobile Container (Centered on larger screens) -->
<div class="flex-1 w-full max-w-md bg-background md:sketchy-border md:sketchy-shadow md:m-8 md:min-h-[800px] relative overflow-hidden flex flex-col">
<!-- App Bar: TopAppBar (Suppressed navigational shell due to transactional nature, but keeping a simple back header) -->
<header class="flex justify-between items-center px-margin-page py-stack-sm w-full bg-surface">
<button class="text-primary hover:bg-primary-container p-2 rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-headline-md" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<div class="font-headline-md text-headline-md text-on-surface">Reset</div>
<div class="w-10"></div> <!-- Placeholder for balance -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-margin-page flex flex-col pt-stack-lg pb-stack-lg relative z-10">
<!-- Illustration Area -->
<div class="flex justify-center mb-stack-lg">
<div class="w-32 h-32 rounded-full bg-secondary-container sketchy-border flex items-center justify-center relative overflow-hidden">
<!-- Placeholder for sketchy illustration -->
<span class="material-symbols-outlined text-6xl text-secondary" style="font-variation-settings: 'FILL' 0;">lock_reset</span>
<!-- Decorative hand-drawn circles around it -->
<div class="absolute inset-0 border border-secondary opacity-30 rounded-full" style="border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; transform: scale(1.1) rotate(15deg);"></div>
<div class="absolute inset-0 border border-secondary opacity-20 rounded-full" style="border-radius: 60% 40% 30% 70% / 50% 40% 50% 60%; transform: scale(1.15) rotate(-20deg);"></div>
</div>
</div>
<!-- Headers -->
<div class="text-center mb-stack-lg">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-stack-sm">Reset Password</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mx-auto">
                    Create a new safe word for your digital scrapbook. Make it memorable.
                </p>
</div>
<!-- Form Area -->
<form class="flex flex-col gap-stack-md mt-stack-sm">
<!-- Input Group: New Password -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant pl-2">New Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">key</span>
</div>
<input class="w-full pl-10 pr-10 py-3 bg-surface border-none sketchy-border sketchy-input text-on-surface font-body-lg text-body-lg placeholder:text-outline-variant transition-colors" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">visibility_off</span>
</button>
</div>
</div>
<!-- Input Group: Confirm Password -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant pl-2">Confirm New Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">password</span>
</div>
<input class="w-full pl-10 pr-10 py-3 bg-surface border-none sketchy-border sketchy-input text-on-surface font-body-lg text-body-lg placeholder:text-outline-variant transition-colors" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Action Area (Pushed to bottom using margin-top auto if needed, but keeping it in flow here for a more natural form feel) -->
<div class="mt-stack-lg pt-stack-sm">
<button class="w-full py-4 bg-primary text-on-primary font-headline-md text-headline-md sketchy-border-button sketchy-shadow sketchy-shadow-active transition-all duration-150 flex justify-center items-center gap-2" type="button">
<span>Update Password</span>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
</div>
</form>
<!-- Decorative Element (Washi tape style) -->
<div class="absolute top-0 right-8 w-16 h-4 bg-tertiary-container opacity-60 transform rotate-12 origin-right" style="clip-path: polygon(0 10%, 100% 0, 95% 100%, 5% 90%);"></div>
</main>
<!-- BottomNavBar is deliberately suppressed based on Semantic Shell Mandate (Linear/Transactional intent) -->
</div>
</body></html>
