<!DOCTYPE html>

<html lang="en"><head>

            border: 2px solid #4b463a;

        }

        }
        .wobble-circle {
            border-radius: 50% 45% 52% 48% / 48% 52% 45% 50%;
            border: 2px solid #4b463a;
        }
        .scribble-bg {
            background-image: radial-gradient(#cdc6b6 0.5px, transparent 0.5px);
            background-size: 8px 8px;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>

<style>
    body {

<body class="bg-background text-on-surface font-body-md min-h-screen pb-24">
<!-- Top Navigation -->
<header class="fixed top-0 w-full bg-surface z-50 flex justify-between items-center px-margin-page py-stack-sm border-b-2 border-outline-variant">
<button class="flex items-center justify-center p-2 text-primary active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">Change Avatar</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="pt-20 px-margin-page flex flex-col items-center">

<span class="material-symbols-outlined text-on-primary-container" data-icon="edit">edit</span>
</div>
</div>
<p class="font-label-sm text-label-sm mt-4 text-on-surface-variant uppercase tracking-widest">Current Profile Picture</p>
</div>
<!-- Action Buttons -->
<div class="grid grid-cols-2 gap-gutter w-full mb-stack-lg">
<button class="flex flex-col items-center justify-center p-4 bg-surface-container hand-drawn-border sketch-shadow active:active-sketch-shadow transition-all">
<span class="material-symbols-outlined text-primary mb-2 text-3xl" data-icon="add_a_photo">add_a_photo</span>
<span class="font-label-sm text-label-sm text-on-surface">Upload Photo</span>
</button>
<button class="flex flex-col items-center justify-center p-4 bg-primary-container hand-drawn-border sketch-shadow active:active-sketch-shadow transition-all">
<span class="material-symbols-outlined text-primary mb-2 text-3xl" data-icon="palette">palette</span>
<span class="font-label-sm text-label-sm text-on-surface">Choose Art</span>
</button>
</div>
<!-- Illustration Grid -->
<div class="w-full">
<div class="flex items-center gap-2 mb-stack-md">
<span class="material-symbols-outlined text-primary" data-icon="draw">draw</span>
<h2 class="font-headline-md text-headline-md">Illustrations</h2>
</div>
<div class="grid grid-cols-3 gap-gutter">
<!-- Avatar Option 1 -->

</button>
<!-- Avatar Option 2 (Active/Selected) -->

<img class="w-full h-full object-cover rounded-lg opacity-80" data-alt="A minimalist line-art character of a smiling person with round glasses, drawn with a digital pen that simulates a pencil on paper. The illustration features soft, pastel yellow fills that slightly bleed over the charcoal outlines. The overall mood is cheerful, serene, and friendly, designed for a safe digital diary space." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAARKaox-7B6otJ_KWAP9vv4_0RXIXug2HgXKsufthkgQm1qlyM1yzQohzkE7ZgGrrtlRyINtbarFnCLUnyZdIoJDB3JCXTjPeOm-_X3_UG-VnK-CQNAojkQt-J2S7SY-dKKDGW65kfo8PZ1oJLr4l7l9vE6F4V63qqxJ7JTfv2Jry_VTFWaU7V6INy4d6GVEV84JsvKxy2czQQrpLMDdtIaPHUX6R0kK0VikfmzEf48V3P3iv0PikT1mKkcOd75hv4b3T1L-QXzyT6"/>
<div class="absolute inset-0 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-4xl font-bold" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
<!-- Avatar Option 3 -->
<button class="aspect-square bg-surface-container-lowest hand-drawn-border flex items-center justify-center p-1 active:scale-95 transition-transform overflow-hidden">
<img class="w-full h-full object-cover rounded-lg" data-alt="A whimsical, hand-drawn character of a plant in a small pot with a tiny smiley face, representing growth and mindfulness. The drawing style uses soft graphite lines and muted olive and cream tones. It sits on a background that resembles the grainy texture of a physical scrapbook page." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC4Tc2TIvXo46NxZ50m51Uw8K_XSR0iFJ7759zdBh8ZHx3k3fe4N_WCl59aQG-JjrhjYnX2fa7iuwvjahuJMyGTPRFzB5wXwmMQTOdH5A6fSKBmhnpTtRwcmZyQVxWHxGuHPk9RKYm9I0RZOTlV8tZR12osGEPaq7rPSr_WaeUy00RjoMUfsIw9kY1_bYJZT3_Z9ym-teXcIZTAOwSaBgZsQ3vlz16906brbRjA6v_K_d2OA_shONlkFsqL-IsZW8EjZgmfTCBAxNNA"/>
</button>
<!-- Avatar Option 4 -->
<button class="aspect-square bg-surface-container-lowest hand-drawn-border flex items-center justify-center p-1 active:scale-95 transition-transform overflow-hidden">
<img class="w-full h-full object-cover rounded-lg" data-alt="A soft-edged digital sketch of a person wearing a cozy beanie, rendered in a simple, kawaii art style. The color palette is restricted to warm creams and soft grays, with a single pastel yellow highlight. The illustration feels personal and hand-crafted, fitting the empathetic narrative of a daily reflection tool." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCMOaxaBarN2ij4thDW89y2F1O9PNT8yUExKdG8-EmcSVPGbH-vNWab60F4K2dj-XLLNcVim-1XJUILB-_HHWYEzqWUiB8lnGWAjKjI2Gqiikkg5JqJ6KsjVtq52OZDOBdPUEjyhHRWtRo7fB4tKXF57TFjY1hToDOn8h6wZyTLNUpsU6uCr4ryqVMR0-6yAEP0pOQD_K1JRquCf_SPVuPoaAvjxXLAmfh3-VMl-lQ4xFXiaEpTc13-n-Eq6F2W-ve98EWZeEIruaaU"/>
</button>
<!-- Avatar Option 5 -->
<button class="aspect-square bg-surface-container-lowest hand-drawn-border flex items-center justify-center p-1 active:scale-95 transition-transform overflow-hidden">
<img class="w-full h-full object-cover rounded-lg" data-alt="A simple, hand-drawn doodle of a sleepy moon character with closed eyes and a small smile, drawn with thick charcoal lines. Soft yellow stippling creates a gentle glow effect against a textured cream background. The design is calm and unassuming, perfect for a night-time journaling app interface." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDAfQj5WM2Q8VJiIRUD5kHk4cu_vVPXBHJj9UHQHuZAzB2jnF6DK4uI3hZtnqJyYmAZUOEktPVeEn2fELdMKaiHzUV1z1BcT8d7yKvXFU5BdXHwrAnnDSJY_wiGEcr5_jP2XH_i_FpzI-HBYiU04a0NtD9mSidQAN33cFaTveyen0y6w4Sgu-Vdrq1MytgorY6sIrdJuzL3brWk-UEHmfGcN76mOTDxmHslnPZ5zDt3rDDXsr3UrEngULOzRKS0ft8jsHQDkRfiwLJu"/>
</button>
<!-- Avatar Option 6 -->
<button class="aspect-square bg-surface-container-lowest hand-drawn-border flex items-center justify-center p-1 active:scale-95 transition-transform overflow-hidden">
<img class="w-full h-full object-cover rounded-lg" data-alt="An organic, minimalist illustration of a bird in flight, captured with a few expressive brush strokes. The style is inspired by Zen ink drawings, adapted for a modern scrapbook UI. The palette uses muted browns and a light cream background, evoking a sense of freedom and creative expression." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAQZx1EUaSBashf3uwmRJM5Q5u_VrWWhBpQn44BY0ueVKjL6KrCkWcZRrW49QocqgIdjX20HjsjrH5dIuIA1ZKsWHMjk9SgdPgBoLy9P8dAeIfyJUSPXMgMOlR1CgIeNRhFKOyEtrQiEtEEGEF5Q8VCnDBVggLU4YfnOrNIs2oEj2fj0F38LJB6iJP5sUkcLm4p9irJErOFZHz3xneIvEvhQqvol7SlnbMYDKJ67UbrU9PZjscAoNEJYcbGjwTLtrZ1NNXqcqFxZ37e"/>
</button>
</div>
</div>
<!-- Footer Actions -->
<div class="w-full mt-stack-lg flex gap-gutter">
<button class="flex-1 py-3 px-4 font-headline-md text-on-surface-variant border-2 border-outline hand-drawn-border active:scale-95 transition-transform">
                Cancel
            </button>
<button class="flex-1 py-3 px-4 font-headline-md bg-primary text-on-primary hand-drawn-border sketch-shadow active:active-sketch-shadow transition-all">
                Save Changes
            </button>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center bg-surface px-2 py-3 border-t-2 border-outline-variant z-50 rounded-t-xl">
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-high transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="calendar_month">calendar_month</span>
<span class="font-label-sm text-label-sm">Calendar</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-high transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="local_mall">local_mall</span>
<span class="font-label-sm text-label-sm">Store</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-high transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="book">book</span>
<span class="font-label-sm text-label-sm">Diary</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 scale-90 duration-200 ease-in-out" href="#">
<span class="material-symbols-outlined" data-icon="person" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-label-sm text-label-sm">Account</span>
</a>
</nav>
