<div class="flex-1 pl-16 pr-8 py-4 relative">

<button onclick="applyTextColor('#1b1c1c')" class="w-8 h-8 rounded-full bg-on-surface border-2 border-outline flex items-center justify-center relative">
<!-- Active indicator scribble -->
<div class="absolute inset-0 m-auto w-3 h-3 bg-surface rounded-full"></div>
</button>
<button onclick="applyTextColor('#3a637c')" class="w-8 h-8 rounded-full bg-secondary border-2 border-outline hover:scale-110 transition-transform"></button>
<button onclick="applyTextColor('#7e5262')" class="w-8 h-8 rounded-full bg-tertiary border-2 border-outline hover:scale-110 transition-transform"></button>
<button onclick="applyTextColor('#6b5e28')" class="w-8 h-8 rounded-full bg-primary border-2 border-outline hover:scale-110 transition-transform"></button>
</div>

</main>
<script>
    function applyTextColor(color) {
        const editor = document.getElementById('diary-editor');
        editor.focus();
        document.execCommand('foreColor', false, color);
        
        // Update active state UI for color buttons
        document.querySelectorAll('.rounded-full[onclick^="applyTextColor"]').forEach(btn => {
            btn.innerHTML = '';
        });
        const activeBtn = Array.from(document.querySelectorAll('.rounded-full[onclick^="applyTextColor"]'))
            .find(btn => btn.getAttribute('onclick').includes(color));
        if (activeBtn) {
            activeBtn.innerHTML = '<div class="absolute inset-0 m-auto w-3 h-3 bg-surface rounded-full"></div>';
        }
    }

    function formatDoc(cmd, value = null) {
        const editor = document.getElementById('diary-editor');
        editor.focus();
        document.execCommand(cmd, false, value);
        updateToolbarState();
    }

    function updateToolbarState() {
        const buttons = {
            'bold': 'btn-bold',
            'italic': 'btn-italic',
            'underline': 'btn-underline',
            'justifyLeft': 'btn-justifyLeft',
            'justifyCenter': 'btn-justifyCenter',
            'justifyRight': 'btn-justifyRight'
        };

        for (const [cmd, id] of Object.entries(buttons)) {
            const btn = document.getElementById(id);
            if (btn) {
                if (document.queryCommandState(cmd)) {
                    btn.classList.add('bg-primary-container', 'pencil-shadow', 'border-on-surface');
                } else {
                    btn.classList.remove('bg-primary-container', 'pencil-shadow', 'border-on-surface');
                }
            }
        }
    }

    ['click', 'keyup'].forEach(evt => {
        document.getElementById('diary-editor')?.addEventListener(evt, updateToolbarState);
    });
</script>
