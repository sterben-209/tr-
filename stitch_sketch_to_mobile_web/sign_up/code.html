<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign Up - Digital Scrapbook</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&amp;family=Quicksand:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "primary": "#6b5e28",
                      "error": "#ba1a1a",
                      "surface-tint": "#6b5e28",
                      "on-surface-variant": "#4b463a",
                      "on-primary": "#ffffff",
                      "tertiary-container": "#ffe5ec",
                      "surface-container-high": "#eae8e7",
                      "tertiary-fixed-dim": "#efb7ca",
                      "tertiary-fixed": "#ffd9e4",
                      "on-secondary-container": "#3b637d",
                      "surface-dim": "#dbd9d9",
                      "on-error-container": "#93000a",
                      "error-container": "#ffdad6",
                      "background": "#fbf9f8",
                      "outline": "#7c7769",
                      "secondary-container": "#b6dffd",
                      "on-tertiary-container": "#8a5d6d",
                      "on-surface": "#1b1c1c",
                      "primary-fixed-dim": "#d8c685",
                      "inverse-primary": "#d8c685",
                      "on-tertiary": "#ffffff",
                      "on-primary-fixed-variant": "#524612",
                      "surface": "#fbf9f8",
                      "secondary-fixed-dim": "#a3cce9",
                      "tertiary": "#7e5262",
                      "surface-container-highest": "#e4e2e2",
                      "surface-container": "#efeded",
                      "secondary": "#3a637c",
                      "on-tertiary-fixed-variant": "#633b4a",
                      "on-primary-fixed": "#221b00",
                      "surface-container-lowest": "#ffffff",
                      "on-tertiary-fixed": "#31101e",
                      "outline-variant": "#cdc6b6",
                      "on-error": "#ffffff",
                      "primary-container": "#ffeba7",
                      "surface-container-low": "#f5f3f3",
                      "on-secondary": "#ffffff",
                      "on-primary-container": "#786932",
                      "primary-fixed": "#f5e29f",
                      "inverse-on-surface": "#f2f0f0",
                      "on-secondary-fixed": "#001e2e",
                      "inverse-surface": "#303030",
                      "secondary-fixed": "#c7e7ff",
                      "surface-variant": "#e4e2e2",
                      "surface-bright": "#fbf9f8",
                      "on-background": "#1b1c1c",
                      "on-secondary-fixed-variant": "#204b63"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px",
                      "organic": "255px 15px 225px 15px/15px 225px 15px 255px",
                      "organic-btn": "25px 255px 25px 255px/255px 25px 255px 25px",
                      "organic-input": "255px 15px 225px 15px/15px 225px 15px 255px"
              },
              "spacing": {
                      "stack-sm": "8px",
                      "stack-lg": "32px",
                      "margin-page": "20px",
                      "gutter": "12px",
                      "stack-md": "16px"
              },
              "fontFamily": {
                      "body-lg": [
                              "Quicksand"
                      ],
                      "label-sm": [
                              "Quicksand"
                      ],
                      "body-md": [
                              "Quicksand"
                      ],
                      "headline-md": [
                              "Plus Jakarta Sans"
                      ],
                      "headline-lg": [

                      ]
              },
              "fontSize": {
                      "body-lg": [
                              "18px",

                                      "fontWeight": "500"
                              }
                      ],
                      "label-sm": [
                              "12px",
                              {

                                      "letterSpacing": "0.05em",

                              }
                      ],
                      "body-md": [
                              "16px",

                                      "fontWeight": "400"
                              }
                      ],
                      "headline-md": [
                              "22px",
                              {
                                      "lineHeight": "28px",
                                      "fontWeight": "600"
                              }
                      ],
                      "headline-lg": [
                              "28px",
                              {
                                      "lineHeight": "36px",
                                      "letterSpacing": "-0.02em",
                                      "fontWeight": "700"
                              }
                      ]
              }
      },
          },
        }
    </script>
<style>
        /* Custom organic shapes and wobbles for hand-drawn feel */
        .organic-border {
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            border: 2px solid theme('colors.outline');
        }
        .organic-button {
            border-radius: 25px 255px 25px 255px/255px 25px 255px 25px;
            border: 2px solid theme('colors.on-surface');
            box-shadow: 4px 4px 0px 0px theme('colors.outline');
            transition: all 0.2s ease;
        }
        .organic-button:active {
            box-shadow: 0px 0px 0px 0px theme('colors.outline');
            transform: translate(4px, 4px);
        }
        .washi-tape {
            background-color: theme('colors.tertiary-container');
            transform: rotate(-2deg);
            border-radius: 2px 8px 2px 8px;
        }
        .hand-drawn-input {
            border-bottom: 2px solid theme('colors.outline-variant');
            background: transparent;
            transition: border-color 0.3s ease;
        }
        .hand-drawn-input:focus {
            outline: none;
            border-bottom-color: theme('colors.primary');
            box-shadow: 0 4px 6px -4px theme('colors.primary-container');
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation (Suppressed per rules: Linear/Transactional intent, but keeping a minimal back/close context if needed, opting for complete suppression to prioritize canvas) -->
<main class="flex-grow flex flex-col items-center justify-center p-margin-page relative">
<!-- Decorative Background Elements -->
<div class="absolute top-10 left-10 w-24 h-24 bg-secondary-container rounded-full opacity-50 blur-xl -z-10"></div>
<div class="absolute bottom-20 right-10 w-32 h-32 bg-primary-container rounded-full opacity-50 blur-xl -z-10"></div>
<!-- Main Sign Up Card -->
<div class="w-full max-w-md bg-surface organic-border p-8 relative mt-12 mb-8">
<!-- Washi Tape Accent -->
<div class="absolute -top-3 left-1/2 transform -translate-x-1/2 w-32 h-6 washi-tape opacity-80 z-10"></div>
<!-- Illustration Area -->
<div class="flex justify-center mb-6 mt-2 relative">
<div class="w-24 h-24 bg-surface-container-high organic-border flex items-center justify-center relative shadow-[2px_2px_0px_0px_rgba(124,119,105,1)]">
<span class="material-symbols-outlined text-4xl text-primary" data-icon="edit">edit</span>
</div>
</div>
<div class="text-center mb-8">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2 tracking-tight">Start Your Diary</h1>
<p class="font-body-md text-body-md text-on-surface-variant">A quiet space for your thoughts.</p>
</div>
<form class="space-y-stack-md flex flex-col">
<!-- Nickname -->
<div class="relative group">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1 ml-1 group-focus-within:text-primary transition-colors" for="nickname">Nickname</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-2 text-on-surface-variant group-focus-within:text-primary transition-colors text-xl" data-icon="face">face</span>
<input class="hand-drawn-input w-full pl-10 pr-4 py-2 font-body-md text-body-md text-on-surface placeholder-outline-variant" id="nickname" name="nickname" placeholder="What should we call you?" required="" type="text"/>
</div>
</div>
<!-- Email -->
<div class="relative group pt-2">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1 ml-1 group-focus-within:text-primary transition-colors" for="email">Email</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-2 text-on-surface-variant group-focus-within:text-primary transition-colors text-xl" data-icon="mail">mail</span>
<input class="hand-drawn-input w-full pl-10 pr-4 py-2 font-body-md text-body-md text-on-surface placeholder-outline-variant" id="email" name="email" placeholder="your@email.com" required="" type="email"/>
</div>
</div>
<!-- Password -->
<div class="relative group pt-2">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1 ml-1 group-focus-within:text-primary transition-colors" for="password">Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-2 text-on-surface-variant group-focus-within:text-primary transition-colors text-xl" data-icon="lock">lock</span>
<input class="hand-drawn-input w-full pl-10 pr-4 py-2 font-body-md text-body-md text-on-surface placeholder-outline-variant" id="password" name="password" placeholder="Keep it secret" required="" type="password"/>
</div>
</div>
<!-- Confirm Password -->
<div class="relative group pt-2">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1 ml-1 group-focus-within:text-primary transition-colors" for="confirm_password">Confirm Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-2 text-on-surface-variant group-focus-within:text-primary transition-colors text-xl" data-icon="check_circle">check_circle</span>
<input class="hand-drawn-input w-full pl-10 pr-4 py-2 font-body-md text-body-md text-on-surface placeholder-outline-variant" id="confirm_password" name="confirm_password" placeholder="One more time" required="" type="password"/>
</div>
</div>
<!-- Actions -->
<div class="pt-stack-lg flex flex-col items-center space-y-stack-md">
<button class="w-full organic-button bg-primary-container text-on-primary-container font-headline-md text-headline-md py-3 px-6 flex items-center justify-center gap-2 hover:bg-primary-fixed transition-colors" type="submit">
                        Create Account
                        <span class="material-symbols-outlined" data-icon="arrow_right_alt">arrow_right_alt</span>
</button>
<p class="font-body-md text-body-md text-on-surface-variant">
                        Already have an account? 
                        <a class="text-primary font-bold hover:underline decoration-2 underline-offset-4 decoration-primary/50 relative inline-block" href="#">
                            Log In
                            <!-- Hand drawn scribble under link effect -->
<svg class="absolute -bottom-1 left-0 w-full h-2 text-primary opacity-30" preserveaspectratio="none" viewbox="0 0 100 10">
<path d="M0,5 Q25,10 50,2 T75,8 100,5" fill="none" stroke="currentColor" stroke-width="2" vector-effect="non-scaling-stroke"></path>
</svg>
</a>
</p>
</div>
</form>
</div>
</main>
<!-- Bottom Navigation (Suppressed due to Linear/Transactional intent of Sign Up screen) -->
</body></html>
