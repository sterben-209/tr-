<style>

        }

<body class="bg-background font-body-md text-on-background min-h-screen flex flex-col">
<!-- Header Section (Process Screen - Minimal Nav) -->
<header class="flex items-center px-margin-page py-stack-md">
<button class="text-on-surface flex items-center justify-center w-10 h-10 rounded-full">
<span class="material-symbols-outlined" style="font-size: 24px;">arrow_back</span>
</button>
<span class="ml-2 font-headline-md text-on-surface">Back</span>
</header>
<main class="flex-1 flex flex-col items-center justify-center px-margin-page py-stack-lg relative overflow-hidden">
<!-- Whimsical Background Elements -->
<div class="absolute top-10 left-10 opacity-20 transform -rotate-12">
<span class="material-symbols-outlined text-primary" style="font-size: 48px;">star</span>
</div>
<div class="absolute bottom-20 right-10 opacity-20 transform rotate-45">
<span class="material-symbols-outlined text-secondary" style="font-size: 40px;">attach_file</span>
</div>
<div class="absolute top-1/2 -right-4 opacity-10">
<span class="material-symbols-outlined text-tertiary" style="font-size: 120px;">cloud</span>
</div>
<!-- Main Card Container -->
<div class="w-full max-w-md bg-surface-container-lowest wobbly-card p-8 flex flex-col items-center text-center relative">
<!-- Washi Tape Accent -->
<div class="absolute -top-4 left-1/2 -translate-x-1/2 w-24 h-8 bg-secondary-container opacity-80 transform rotate-2 hand-drawn-border border-none"></div>
<!-- Illustration -->
<div class="mb-stack-md w-32 h-32 flex items-center justify-center bg-primary-container rounded-full hand-drawn-border overflow-hidden">
<img class="w-20 h-20 object-contain" data-alt="A soft, hand-drawn charcoal illustration of a small mail envelope with tiny heart bubbles floating out of it. The aesthetic is minimalist and whimsical, set against a warm pastel yellow circular background. The linework is deliberately wobbly to mimic a sketchbook feel, emphasizing a sense of gentle care and calm reassurance." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCY1MBVGRT-S0FH-y0OlJ2xGGsSt3VJraN91JmecUHwismr2jOUmqg1c2Q-XZp4VDtirkZfDw0YnTio3ueZ8qjBrNsyKk03k4ISA1a1kTr-FW2cxSYsBNzr5s32x1O0AJTTtG-bLBEA4viRG7Ieep9PS7oQ7RcrTOSWikEGi10gIvfyUhj3FVww8hnrQr__Ss48aGNqvdbTFDcIaWxOjNkaHhU3e709lS6a4dGRG8OjeByhmto0hplMEaKomcbpZ6LKSKwOzfKEQ0Qd"/>
</div>
<!-- Heading -->
<h1 class="font-headline-lg text-on-surface mb-stack-sm">Forgot Password?</h1>
<!-- Description -->
<p class="font-body-md text-on-surface-variant mb-stack-lg px-2">
                No worries! Enter your email address and we'll send you a link to reset your password.
            </p>
<!-- Input Field -->
<div class="w-full flex flex-col gap-2 mb-stack-lg text-left">
<label class="font-label-sm text-outline ml-1">Email Address</label>
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center text-outline">
<span class="material-symbols-outlined">mail</span>
</div>
<input class="w-full pl-12 pr-4 py-4 bg-surface text-on-surface font-body-md hand-drawn-border focus:ring-0 focus:border-primary border-2 placeholder:text-outline-variant outline-none" placeholder="hello@calmdiary.com" type="email"/>
</div>
</div>
<!-- Action Button -->
<button class="w-full py-4 bg-primary text-on-primary font-headline-md wobbly-button mb-stack-md">
                Send Reset Link
            </button>
<!-- Secondary Action -->
<a class="font-label-sm text-secondary-fixed-variant hover:text-secondary flex items-center gap-1 group" href="#">
<span class="material-symbols-outlined text-sm">keyboard_backspace</span>
<span class="sketchy-underline">Back to Login</span>
</a>
</div>
<!-- Footnote Illustration -->
<div class="mt-stack-lg flex gap-4 opacity-30">
<span class="material-symbols-outlined text-primary" data-weight="fill">favorite</span>
<span class="material-symbols-outlined text-secondary" data-weight="fill">draw</span>
<span class="material-symbols-outlined text-tertiary" data-weight="fill">auto_awesome</span>
</div>

<p class="text-[10px] font-label-sm text-outline-variant uppercase tracking-widest">
